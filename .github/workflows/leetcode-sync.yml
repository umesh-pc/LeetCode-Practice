name: Sync LeetCode Solutions

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Install dependencies
        run: |
          pip install requests


      - name: Sync LeetCode submissions
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}

        run: |

          python <<'PY'

          import os
          import re
          import time
          import requests


          # =====================================================
          # CONFIGURATION
          # =====================================================

          GRAPHQL_URL = "https://leetcode.com/graphql/"


          SESSION = os.environ["LEETCODE_SESSION"]

          CSRF_TOKEN = os.environ["LEETCODE_CSRF_TOKEN"]


          # =====================================================
          # HTTP SESSION
          # =====================================================

          session = requests.Session()

          session.headers.update({

              "Content-Type": "application/json",

              "Origin": "https://leetcode.com",

              "Referer": "https://leetcode.com/",

              "User-Agent":
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/151.0.0.0 Safari/537.36",

              "x-csrftoken": CSRF_TOKEN

          })


          session.cookies.update({

              "LEETCODE_SESSION": SESSION,

              "csrftoken": CSRF_TOKEN

          })


          # =====================================================
          # GRAPHQL FUNCTION
          # =====================================================

          def graphql(query, variables=None):

              response = session.post(

                  GRAPHQL_URL,

                  json={

                      "query": query,

                      "variables": variables or {}

                  },

                  timeout=30

              )


              print(
                  f"HTTP Status: {response.status_code}"
              )


              if response.status_code != 200:

                  print("LeetCode response:")

                  print(response.text[:5000])

                  raise Exception(
                      f"LeetCode returned HTTP "
                      f"{response.status_code}"
                  )


              result = response.json()


              if "errors" in result:

                  print("GraphQL errors:")

                  print(result["errors"])

                  raise Exception(
                      "GraphQL request failed"
                  )


              return result.get("data")


          # =====================================================
          # GET CURRENT USER
          # =====================================================

          print()

          print("Checking LeetCode login...")


          user_query = """

          query {

              userStatus {

                  isSignedIn

                  username

              }

          }

          """


          user_data = graphql(user_query)


          if not user_data:

              raise Exception(
                  "Could not get user information."
              )


          user_status = user_data["userStatus"]


          if not user_status["isSignedIn"]:

              raise Exception(
                  "LeetCode session has expired."
              )


          username = user_status["username"]


          print(
              f"Successfully authenticated as: "
              f"{username}"
          )


          # =====================================================
          # GET ACCEPTED SUBMISSIONS
          # =====================================================

          print()

          print("Fetching accepted submissions...")


          submissions_query = """

          query recentAcSubmissions(
              $username: String!
              $limit: Int!
          ) {

              recentAcSubmissionList(

                  username: $username

                  limit: $limit

              ) {

                  id

                  title

                  titleSlug

                  timestamp

                  lang

              }

          }

          """


          submissions_data = graphql(

              submissions_query,

              {

                  "username": username,

                  "limit": 100

              }

          )


          if not submissions_data:

              raise Exception(
                  "No submission data received."
              )


          submissions = submissions_data[
              "recentAcSubmissionList"
          ]


          print(
              f"Found {len(submissions)} "
              f"accepted submissions."
          )


          # =====================================================
          # LANGUAGE EXTENSIONS
          # =====================================================

          extensions = {

              "python": "py",
              "python3": "py",

              "cpp": "cpp",
              "c++": "cpp",

              "java": "java",

              "javascript": "js",
              "typescript": "ts",

              "c": "c",

              "csharp": "cs",
              "c#": "cs",

              "kotlin": "kt",

              "swift": "swift",

              "go": "go",

              "rust": "rs",

              "ruby": "rb",

              "php": "php",

              "scala": "scala",

              "sql": "sql"

          }


          # =====================================================
          # CLEAN FOLDER NAME
          # =====================================================

          def clean_name(name):

              name = name.lower()

              name = re.sub(
                  r"[^a-z0-9]+",
                  "-",
                  name
              )

              return name.strip("-")


          # =====================================================
          # SUBMISSION DETAILS
          # =====================================================

          detail_query = """

          query submissionDetails(
              $submissionId: Int!
          ) {

              submissionDetails(
                  submissionId: $submissionId
              ) {

                  code

                  lang

                  timestamp

                  statusCode

                  question {

                      questionFrontendId

                      title

                      titleSlug

                  }

              }

          }

          """


          # =====================================================
          # DOWNLOAD SOLUTIONS
          # =====================================================

          new_solutions = 0


          for submission in submissions:

              submission_id = int(
                  submission["id"]
              )

              title = submission["title"]

              slug = submission["titleSlug"]

              language = submission["lang"]


              extension = extensions.get(
                  language.lower()
              )


              if not extension:

                  print(
                      f"Skipping {title} - "
                      f"unsupported language: "
                      f"{language}"
                  )

                  continue


              folder_name = clean_name(slug)


              folder = os.path.join(
                  "solutions",
                  folder_name
              )


              filepath = os.path.join(

                  folder,

                  f"solution.{extension}"

              )


              # -------------------------------------------------
              # Skip existing solutions
              # -------------------------------------------------

              if os.path.exists(filepath):

                  print(
                      f"Already exists: {title}"
                  )

                  continue


              print()

              print(
                  f"Downloading: {title}"
              )


              # -------------------------------------------------
              # Get submitted code
              # -------------------------------------------------

              detail_data = graphql(

                  detail_query,

                  {

                      "submissionId":
                          submission_id

                  }

              )


              details = detail_data.get(
                  "submissionDetails"
              )


              if not details:

                  print(
                      f"Could not get details "
                      f"for {title}"
                  )

                  continue


              code = details.get("code")


              if not code:

                  print(
                      f"No code returned "
                      f"for {title}"
                  )

                  continue


              question = details["question"]


              problem_number = question[
                  "questionFrontendId"
              ]


              # -------------------------------------------------
              # Create directory
              # -------------------------------------------------

              os.makedirs(

                  folder,

                  exist_ok=True

              )


              # -------------------------------------------------
              # Metadata
              # -------------------------------------------------

              if extension == "sql":

                  metadata = (

                      f"-- LeetCode Problem: "
                      f"{problem_number}. {title}\n"

                      f"-- Language: "
                      f"{language}\n"

                      f"-- Submission ID: "
                      f"{submission_id}\n"

                      f"-- https://leetcode.com/problems/"
                      f"{slug}/\n\n"

                  )

              else:

                  metadata = (

                      f"# LeetCode Problem: "
                      f"{problem_number}. {title}\n"

                      f"# Language: "
                      f"{language}\n"

                      f"# Submission ID: "
                      f"{submission_id}\n"

                      f"# https://leetcode.com/problems/"
                      f"{slug}/\n\n"

                  )


              # -------------------------------------------------
              # Save code
              # -------------------------------------------------

              with open(

                  filepath,

                  "w",

                  encoding="utf-8"

              ) as file:

                  file.write(
                      metadata + code
                  )


              print(
                  f"Saved: {filepath}"
              )


              new_solutions += 1


              time.sleep(1)


          # =====================================================
          # SUMMARY
          # =====================================================

          print()

          print("=" * 60)

          print(
              f"New solutions added: "
              f"{new_solutions}"
          )

          print("=" * 60)


          PY


      # =========================================================
      # COMMIT
      # =========================================================

      - name: Commit solutions
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add solutions


          if git diff --cached --quiet; then

              echo "No new solutions."

          else

              git commit \
                -m "Sync LeetCode solutions"

              git push

          fi
