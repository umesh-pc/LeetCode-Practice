name: Sync LeetCode Solutions

on:
  workflow_dispatch:

  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # CHECKOUT REPOSITORY
      # =========================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =========================================================
      # SETUP PYTHON
      # =========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # =========================================================
      # INSTALL DEPENDENCIES
      # =========================================================

      - name: Install dependencies
        run: |
          pip install requests


      # =========================================================
      # SYNC LEETCODE
      # =========================================================

      - name: Sync LeetCode submissions
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}

        run: |

          python <<'PY'

          import os
          import re
          import time
          import requests


          # =====================================================
          # CONFIGURATION
          # =====================================================

          GRAPHQL_URL = "https://leetcode.com/graphql/"


          SESSION = os.environ["LEETCODE_SESSION"]

          CSRF_TOKEN = os.environ["LEETCODE_CSRF_TOKEN"]


          # =====================================================
          # CREATE HTTP SESSION
          # =====================================================

          session = requests.Session()


          session.headers.update({

              "Content-Type":
                  "application/json",

              "Origin":
                  "https://leetcode.com",

              "Referer":
                  "https://leetcode.com/",

              "User-Agent":
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/151.0.0.0 Safari/537.36",

              "x-csrftoken":
                  CSRF_TOKEN

          })


          session.cookies.update({

              "LEETCODE_SESSION":
                  SESSION,

              "csrftoken":
                  CSRF_TOKEN

          })


          # =====================================================
          # GRAPHQL REQUEST FUNCTION
          # =====================================================

          def graphql(query, variables=None):

              response = session.post(

                  GRAPHQL_URL,

                  json={

                      "query":
                          query,

                      "variables":
                          variables or {}

                  },

                  timeout=30

              )


              print(
                  f"HTTP Status: {response.status_code}"
              )


              # -------------------------------------------------
              # Handle HTTP errors
              # -------------------------------------------------

              if response.status_code != 200:

                  print()
                  print("LeetCode response:")

                  print(
                      response.text[:5000]
                  )

                  raise Exception(
                      f"LeetCode returned "
                      f"HTTP {response.status_code}"
                  )


              # -------------------------------------------------
              # Parse JSON
              # -------------------------------------------------

              result = response.json()


              # -------------------------------------------------
              # Handle GraphQL errors
              # -------------------------------------------------

              if "errors" in result:

                  print()
                  print("GraphQL errors:")

                  print(
                      result["errors"]
                  )

                  raise Exception(
                      "GraphQL request failed"
                  )


              return result.get("data")


          # =====================================================
          # GET LOGGED-IN USER
          # =====================================================

          print()
          print("Checking LeetCode login...")


          user_query = """

          query {

              userStatus {

                  isSignedIn

                  username

              }

          }

          """


          user_data = graphql(
              user_query
          )


          if not user_data:

              raise Exception(
                  "Could not get LeetCode user information."
              )


          user_status = user_data[
              "userStatus"
          ]


          if not user_status[
              "isSignedIn"
          ]:

              raise Exception(
                  "LeetCode session is invalid or expired."
              )


          username = user_status[
              "username"
          ]


          print(
              f"Successfully authenticated as: "
              f"{username}"
          )


          # =====================================================
          # GET RECENT ACCEPTED SUBMISSIONS
          # =====================================================

          print()
          print(
              "Fetching accepted submissions..."
          )


          submissions_query = """

          query recentAcSubmissions(
              $username: String!
              $limit: Int!
          ) {

              recentAcSubmissionList(

                  username: $username

                  limit: $limit

              ) {

                  id

                  title

                  titleSlug

                  timestamp

              }

          }

          """


          submissions_data = graphql(

              submissions_query,

              {

                  "username":
                      username,

                  "limit":
                      100

              }

          )


          if not submissions_data:

              raise Exception(
                  "No submission data received."
              )


          submissions = submissions_data[
              "recentAcSubmissionList"
          ]


          print(
              f"Found {len(submissions)} "
              f"accepted submissions."
          )


          # =====================================================
          # LANGUAGE → FILE EXTENSION
          # =====================================================

          extensions = {

              "python":
                  "py",

              "python3":
                  "py",

              "cpp":
                  "cpp",

              "c++":
                  "cpp",

              "java":
                  "java",

              "javascript":
                  "js",

              "typescript":
                  "ts",

              "c":
                  "c",

              "csharp":
                  "cs",

              "c#":
                  "cs",

              "kotlin":
                  "kt",

              "swift":
                  "swift",

              "go":
                  "go",

              "rust":
                  "rs",

              "ruby":
                  "rb",

              "php":
                  "php",

              "scala":
                  "scala",

              "sql":
                  "sql"

          }


          # =====================================================
          # CLEAN PROBLEM NAME
          # =====================================================

          def clean_name(name):

              name = name.lower()


              name = re.sub(
                  r"[^a-z0-9]+",
                  "-",
                  name
              )


              return name.strip("-")


          # =====================================================
          # GET SUBMISSION DETAILS
          #
          # IMPORTANT:
          #
          # lang is now a LanguageNode.
          #
          # Therefore:
          #
          # lang {
          #     name
          #     verboseName
          # }
          #
          # =====================================================

          detail_query = """

          query submissionDetails(
              $submissionId: Int!
          ) {

              submissionDetails(
                  submissionId: $submissionId
              ) {

                  code

                  timestamp

                  statusCode

                  lang {

                      name

                      verboseName

                  }

                  question {

                      questionFrontendId

                      title

                      titleSlug

                  }

              }

          }

          """


          # =====================================================
          # DOWNLOAD SOLUTIONS
          # =====================================================

          new_solutions = 0


          for submission in submissions:

              # -------------------------------------------------
              # Submission information
              # -------------------------------------------------

              submission_id = int(
                  submission["id"]
              )


              title = submission[
                  "title"
              ]


              slug = submission[
                  "titleSlug"
              ]


              print()
              print(
                  "----------------------------------------"
              )


              print(
                  f"Processing: {title}"
              )


              print(
                  f"Submission ID: "
                  f"{submission_id}"
              )


              # -------------------------------------------------
              # Create folder name
              # -------------------------------------------------

              folder_name = clean_name(
                  slug
              )


              folder = os.path.join(

                  "solutions",

                  folder_name

              )


              # -------------------------------------------------
              # Get submission details FIRST
              #
              # We need the language from here.
              # -------------------------------------------------

              print(
                  f"Downloading: {title}"
              )


              try:

                  detail_data = graphql(

                      detail_query,

                      {

                          "submissionId":
                              submission_id

                      }

                  )

              except Exception as error:

                  print(
                      f"Failed to get "
                      f"submission details: {error}"
                  )

                  continue


              if not detail_data:

                  print(
                      f"No detail data for "
                      f"{title}"
                  )

                  continue


              details = detail_data.get(
                  "submissionDetails"
              )


              if not details:

                  print(
                      f"No submission details "
                      f"for {title}"
                  )

                  continue


              # -------------------------------------------------
              # Get submitted code
              # -------------------------------------------------

              code = details.get(
                  "code"
              )


              if not code:

                  print(
                      f"No code returned "
                      f"for {title}"
                  )

                  continue


              # -------------------------------------------------
              # Get language
              #
              # IMPORTANT:
              #
              # details["lang"] is an object:
              #
              # {
              #     "name": "...",
              #     "verboseName": "..."
              # }
              #
              # -------------------------------------------------

              language_data = details.get(
                  "lang"
              )


              if not language_data:

                  print(
                      f"No language returned "
                      f"for {title}"
                  )

                  continue


              language = language_data.get(
                  "name"
              )


              verbose_language = language_data.get(
                  "verboseName"
              )


              if not language:

                  print(
                      f"Could not determine "
                      f"language for {title}"
                  )

                  continue


              print(
                  f"Language: "
                  f"{verbose_language}"
              )


              # -------------------------------------------------
              # Find extension
              # -------------------------------------------------

              extension = extensions.get(
                  language.lower()
              )


              if not extension:

                  print(
                      f"Unsupported language: "
                      f"{language}"
                  )

                  continue


              # -------------------------------------------------
              # Check if solution already exists
              # -------------------------------------------------

              filepath = os.path.join(

                  folder,

                  f"solution.{extension}"

              )


              if os.path.exists(filepath):

                  print(
                      f"Already exists: "
                      f"{filepath}"
                  )

                  continue


              # -------------------------------------------------
              # Get problem information
              # -------------------------------------------------

              question = details.get(
                  "question"
              )


              if not question:

                  print(
                      f"No question information "
                      f"for {title}"
                  )

                  continue


              problem_number = question.get(
                  "questionFrontendId"
              )


              # -------------------------------------------------
              # Create directory
              # -------------------------------------------------

              os.makedirs(

                  folder,

                  exist_ok=True

              )


              # =================================================
              # CREATE FILE HEADER
              # =================================================

              if extension == "sql":

                  metadata = (

                      f"-- LeetCode Problem: "
                      f"{problem_number}. "
                      f"{title}\n"

                      f"-- Language: "
                      f"{verbose_language}\n"

                      f"-- Submission ID: "
                      f"{submission_id}\n"

                      f"-- "
                      f"https://leetcode.com/problems/"
                      f"{slug}/\n\n"

                  )

              else:

                  metadata = (

                      f"# LeetCode Problem: "
                      f"{problem_number}. "
                      f"{title}\n"

                      f"# Language: "
                      f"{verbose_language}\n"

                      f"# Submission ID: "
                      f"{submission_id}\n"

                      f"# "
                      f"https://leetcode.com/problems/"
                      f"{slug}/\n\n"

                  )


              # =================================================
              # SAVE SOLUTION
              # =================================================

              try:

                  with open(

                      filepath,

                      "w",

                      encoding="utf-8"

                  ) as file:

                      file.write(

                          metadata +

                          code

                      )

              except Exception as error:

                  print(
                      f"Failed to save "
                      f"{filepath}: {error}"
                  )

                  continue


              print(
                  f"SUCCESS: Saved → "
                  f"{filepath}"
              )


              new_solutions += 1


              # -------------------------------------------------
              # Small delay between requests
              # -------------------------------------------------

              time.sleep(1)


          # =====================================================
          # FINAL SUMMARY
          # =====================================================

          print()
          print()
          print(
              "=" * 60
          )

          print(
              f"New solutions added: "
              f"{new_solutions}"
          )

          print(
              "=" * 60
          )


          PY


      # =========================================================
      # COMMIT AND PUSH
      # =========================================================

      - name: Commit solutions
        run: |

          git config user.name \
            "github-actions[bot]"


          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add solutions


          if git diff --cached --quiet; then

              echo "No new solutions found."

          else

              git commit \
                -m "Sync LeetCode solutions"

              git push

          fi
